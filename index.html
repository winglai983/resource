<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>個人消費控制助手 v3.0</title>
  <!-- 引入 Chart.js 繪製圓餅圖 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-dark: #4338ca;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #1f2937;
      --text-light: #6b7280;
      --income: #10b981;
      --expense: #ef4444;
      --warning: #f59e0b;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 12px;
      max-width: 600px;
      margin: 0 auto;
      padding-bottom: 30px;
    }

    h1 { font-size: 1.5rem; margin-bottom: 16px; text-align: center; }
    h3 { font-size: 1.1rem; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    .dashboard {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      text-align: center;
    }

    .savings-label { font-size: 0.9rem; opacity: 0.9; }
    .savings-amount { font-size: 2.5rem; font-weight: 800; margin: 8px 0; letter-spacing: -1px; }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.2);
      padding-top: 16px;
    }

    .stat-box { font-size: 0.85rem; opacity: 0.9; }
    .stat-box span { display: block; font-size: 1.25rem; font-weight: 700; margin-top: 4px; }

    .budget-progress-container {
      margin-top: 16px;
      background: rgba(255,255,255,0.2);
      border-radius: 10px;
      padding: 12px;
      text-align: left;
    }

    .budget-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      margin-bottom: 6px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background-color: rgba(255,255,255,0.3);
      border-radius: 5px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background-color: #6ee7b7;
      width: 0%;
      transition: width 0.3s ease, background-color 0.3s ease;
    }

    .progress-warning { background-color: var(--warning) !important; }
    .progress-danger { background-color: #fca5a5 !important; }

    .chart-container {
      position: relative;
      margin: 16px auto 0 auto;
      height: 200px;
      width: 200px;
    }

    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.85rem; margin-bottom: 4px; color: var(--text-light); }

    input, select, button {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      -webkit-appearance: none;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:active { background-color: var(--primary-dark); }

    .btn-danger {
      background-color: #fee2e2;
      color: var(--expense);
      padding: 4px 8px;
      font-size: 0.75rem;
      border-radius: 6px;
      width: auto;
    }

    .card-reminder-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--bg);
    }
    .card-reminder-item:last-child { border-bottom: none; }

    .badge {
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      background-color: var(--bg);
      color: var(--text-light);
    }
    .badge.alert { background-color: #fee2e2; color: var(--expense); }
    .badge.soon { background-color: #fffbeb; color: var(--warning); }

    .transaction-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--bg);
    }
    .transaction-item:last-child { border-bottom: none; }

    .trans-main { display: flex; flex-direction: column; }
    .trans-cat { font-weight: 600; }
    .trans-info { font-size: 0.75rem; color: var(--text-light); margin-top: 2px; }
    
    .trans-amount { font-weight: 700; font-size: 1.1rem; }
    .amount-income { color: var(--income); }
    .amount-expense { color: var(--expense); }

    details summary {
      font-size: 0.9rem;
      color: var(--primary);
      cursor: pointer;
      list-style: none;
      text-align: center;
      padding: 8px;
    }
    details summary::-webkit-details-marker { display: none; }

    @media (max-width: 480px) {
      body { padding: 10px; }
      .card { padding: 14px; }
      input, select, button { padding: 14px; }
    }
  </style>
</head>
<body>

  <h1>💰 個人財務助手 v3.0</h1>

  <!-- 1. 當月總覽儀表板 -->
  <div class="card dashboard">
    <div class="savings-label">本月預估可存金額</div>
    <div class="savings-amount" id="savingsAmount">$0</div>
    
    <div class="stats-grid">
      <div class="stat-box">
        本月總收入
        <span id="monthlyIncome" style="color: #6ee7b7;">+$0</span>
      </div>
      <div class="stat-box">
        本月總支出
        <span id="monthlyExpense" style="color: #fca5a5;">-$0</span>
      </div>
    </div>

    <!-- 預算進度條 -->
    <div class="budget-progress-container">
      <div class="budget-header">
        <span>每月支出預算進度</span>
        <span id="budgetStatusText">未設定</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="budgetProgressBar"></div>
      </div>
      <div style="font-size: 0.75rem; margin-top: 4px; text-align: right; opacity: 0.8;" id="budgetValueText">
        $0 / $0
      </div>
    </div>

    <!-- 分類圓餅圖 -->
    <div class="chart-container">
      <canvas id="expenseChart"></canvas>
    </div>
  </div>

  <!-- 2. 設定區 (預算與信用卡) -->
  <div class="card">
    <details>
      <summary>⚙️ 設定預算與管理信用卡</summary>
      <div style="margin-top: 15px;">
        <form id="budgetForm" style="margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border);">
          <h4 style="margin-bottom: 10px; font-size: 0.9rem;">🎯 設定每月支出預算</h4>
          <div class="form-group" style="display: flex; gap: 8px;">
            <input type="number" id="budgetAmount" placeholder="輸入預算金額" required>
            <button type="submit" style="width: auto; white-space: nowrap; padding: 0 15px;">設定</button>
          </div>
        </form>

        <h4 style="margin-bottom: 10px; font-size: 0.9rem;">💳 新增信用卡</h4>
        <form id="cardForm">
          <div class="form-group">
            <input type="text" id="cardName" placeholder="卡片名稱 (如: 玉山 Cube)" required>
          </div>
          <div class="form-group" style="display: flex; gap: 8px;">
            <input type="number" id="statementDay" placeholder="結帳日 (1-31)" min="1" max="31" required>
            <input type="number" id="dueDate" placeholder="繳費日 (1-31)" min="1" max="31" required>
          </div>
          <button type="submit">儲存卡片</button>
        </form>
      </div>
    </details>
  </div>

  <!-- 3. 信用卡提醒與清單管理卡片 -->
  <div class="card">
    <h3>💳 信用卡繳費與結帳提醒</h3>
    <div id="creditCardList"></div>
  </div>

  <!-- 4. 新增記帳卡片 (支援支付方式與多種收入分類) -->
  <div class="card">
    <h3>📝 新增收支記錄</h3>
    <form id="transactionForm">
      <div class="form-group">
        <label>收支類型</label>
        <select id="type" onchange="handleTypeChange()">
          <option value="expense">支出 (-)</option>
          <option value="income">收入 (+)</option>
        </select>
      </div>

      <div class="form-group">
        <label>支付方式 / 帳戶</label>
        <select id="paymentMethod">
          <!-- 動態由 JavaScript 生成選項 -->
        </select>
      </div>

      <div class="form-group">
        <label>金額</label>
        <input type="number" id="amount" placeholder="金額" inputmode="numeric" required>
      </div>

      <div class="form-group">
        <label>類別</label>
        <input type="text" id="category" placeholder="選擇或輸入類別" list="categoryOptions" required>
        <datalist id="categoryOptions">
          <!-- 動態切換收入/支出預設類別 -->
        </datalist>
      </div>

      <div class="form-group">
        <label>日期</label>
        <input type="date" id="date" required>
      </div>

      <button type="submit">記下一筆</button>
    </form>
  </div>

  <!-- 5. 當月明細記錄 -->
  <div class="card">
    <h3>📋 當月明細記錄</h3>
    <div id="transactionList"></div>
  </div>

  <script>
    // --- 資料狀態 ---
    let transactions = JSON.parse(localStorage.getItem('transactions')) || [];
    let creditCards = JSON.parse(localStorage.getItem('creditCards')) || [];
    let monthlyBudget = parseFloat(localStorage.getItem('monthlyBudget')) || 0;

    let expenseChart = null;

    const now = new Date();
    const todayStr = now.toISOString().substring(0, 10);
    document.getElementById('date').value = todayStr;

    // 預設分類選項
    const expenseCategories = ['餐飲', '交通', '購物', '娛樂', '租金', '水電費', '醫療', '其他支出'];
    const incomeCategories = ['薪資', '獎金', '投資收益', '副業/兼職', '紅包/壓歲錢', '其他收入'];

    function init() {
      initChart();
      updateDashboard();
      renderCreditCards();
      renderTransactions();
      handleTypeChange(); // 初始化下拉選項
      
      if (monthlyBudget > 0) {
        document.getElementById('budgetAmount').value = monthlyBudget;
      }
    }

    // 當切換「收入」或「支出」時，動態改變「支付方式」與「類別建議」
    function handleTypeChange() {
      const type = document.getElementById('type').value;
      const paymentSelect = document.getElementById('paymentMethod');
      const categoryDatalist = document.getElementById('categoryOptions');

      paymentSelect.innerHTML = '';
      categoryDatalist.innerHTML = '';

      if (type === 'expense') {
        // 支出：可選現金或已儲存的信用卡
        const cashOpt = document.createElement('option');
        cashOpt.value = '現金';
        cashOpt.textContent = '💵 現金 / 轉帳';
        paymentSelect.appendChild(cashOpt);

        creditCards.forEach(card => {
          const opt = document.createElement('option');
          opt.value = `信用卡:${card.name}`;
          opt.textContent = `💳 ${card.name} (結帳日:${card.statementDay}日)`;
          paymentSelect.appendChild(opt);
        });

        // 填充支出類別
        expenseCategories.forEach(cat => {
          const opt = document.createElement('option');
          opt.value = cat;
          categoryDatalist.appendChild(opt);
        });

      } else {
        // 收入：可選銀行戶頭或現金
        const bankOpt = document.createElement('option');
        bankOpt.value = '銀行轉帳';
        bankOpt.textContent = '🏦 銀行轉帳 / 帳戶';
        paymentSelect.appendChild(bankOpt);

        const cashOpt = document.createElement('option');
        cashOpt.value = '現金';
        cashOpt.textContent = '💵 現金';
        paymentSelect.appendChild(cashOpt);

        // 填充收入類別
        incomeCategories.forEach(cat => {
          const opt = document.createElement('option');
          opt.value = cat;
          categoryDatalist.appendChild(opt);
        });
      }
    }

    // --- 圖表邏輯 ---
    function initChart() {
      const ctx = document.getElementById('expenseChart').getContext('2d');
      const config = {
        type: 'doughnut',
        data: {
          labels: [],
          datasets: [{
            data: [],
            backgroundColor: ['#818cf8', '#38bdf8', '#fb7185', '#fb923c', '#4ade80', '#a78bfa', '#e879f9'],
            borderWidth: 0,
            hoverOffset: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: function(context) {
                  const label = context.label || '';
                  const value = context.parsed || 0;
                  const total = context.dataset.data.reduce((a, b) => a + b, 0);
                  const percentage = ((value / total) * 100).toFixed(1) + '%';
                  return `${label}: $${value.toLocaleString()} (${percentage})`;
                }
              }
            }
          }
        }
      };
      expenseChart = new Chart(ctx, config);
    }

    function updateChart(categoryTotals) {
      if (!expenseChart) return;

      const labels = Object.keys(categoryTotals);
      const data = Object.values(categoryTotals);

      if (data.length === 0) {
        expenseChart.data.labels = ['暫無支出'];
        expenseChart.data.datasets[0].data = [1];
        expenseChart.data.datasets[0].backgroundColor = ['#e5e7eb'];
        expenseChart.options.plugins.tooltip.enabled = false;
      } else {
        expenseChart.data.labels = labels;
        expenseChart.data.datasets[0].data = data;
        expenseChart.data.datasets[0].backgroundColor = ['#818cf8', '#38bdf8', '#fb7185', '#fb923c', '#4ade80', '#a78bfa', '#e879f9'];
        expenseChart.options.plugins.tooltip.enabled = true;
      }
      expenseChart.update();
    }

    // --- 儀表板計算 ---
    function updateDashboard() {
      const currentYear = now.getFullYear();
      const currentMonth = now.getMonth();

      let totalIncome = 0;
      let totalExpense = 0;
      const expenseByCategory = {};

      transactions.forEach(t => {
        const tDate = new Date(t.date);
        if (tDate.getFullYear() === currentYear && tDate.getMonth() === currentMonth) {
          const amount = parseFloat(t.amount);
          if (t.type === 'income') {
            totalIncome += amount;
          } else {
            totalExpense += amount;
            const cat = t.category || '未分類';
            expenseByCategory[cat] = (expenseByCategory[cat] || 0) + amount;
          }
        }
      });

      const savings = totalIncome - totalExpense;

      document.getElementById('monthlyIncome').textContent = `+$${totalIncome.toLocaleString()}`;
      document.getElementById('monthlyExpense').textContent = `-$${totalExpense.toLocaleString()}`;
      document.getElementById('savingsAmount').textContent = `$${savings.toLocaleString()}`;

      updateChart(expenseByCategory);
      updateBudgetProgress(totalExpense);
    }

    function updateBudgetProgress(currentExpense) {
      const progressBar = document.getElementById('budgetProgressBar');
      const statusText = document.getElementById('budgetStatusText');
      const valueText = document.getElementById('budgetValueText');

      if (monthlyBudget <= 0) {
        progressBar.style.width = '0%';
        statusText.textContent = '未設定';
        statusText.style.color = 'white';
        valueText.textContent = `$${currentExpense.toLocaleString()} / 未設定`;
        return;
      }

      let percentage = (currentExpense / monthlyBudget) * 100;
      const displayPercentage = Math.min(percentage, 100);
      progressBar.style.width = `${displayPercentage}%`;

      progressBar.className = 'progress-bar-fill'; 
      statusText.style.color = '#6ee7b7';

      if (currentExpense > monthlyBudget) {
        progressBar.classList.add('progress-danger');
        statusText.textContent = '⚠️ 已超支！';
        statusText.style.color = '#fca5a5';
      } else if (percentage >= 90) {
        progressBar.classList.add('progress-warning');
        statusText.textContent = '🔔 預算即將用盡';
        statusText.style.color = var(--warning);
      } else if (percentage >= 70) {
        progressBar.classList.add('progress-warning');
        statusText.textContent = '注意支出';
        statusText.style.color = var(--warning);
      } else {
        statusText.textContent = '良好';
      }

      valueText.textContent = `$${currentExpense.toLocaleString()} / $${monthlyBudget.toLocaleString()}`;
    }

    // --- 信用卡渲染與刪除功能 ---
    function renderCreditCards() {
      const listEl = document.getElementById('creditCardList');
      listEl.innerHTML = '';

      if (creditCards.length === 0) {
        listEl.innerHTML = '<p style="font-size:0.85rem; color:var(--text-light); text-align:center; padding:10px;">尚未新增信用卡資料</p>';
        return;
      }

      const today = new Date();
      today.setHours(0,0,0,0);
      const currentYear = today.getFullYear();
      const currentMonth = today.getMonth();

      creditCards.forEach(card => {
        const div = document.createElement('div');
        div.className = 'card-reminder-item';

        let dueThisMonth = new Date(currentYear, currentMonth, card.dueDate);
        let targetDueDate = (dueThisMonth >= today) ? dueThisMonth : new Date(currentYear, currentMonth + 1, card.dueDate);

        const timeDiff = targetDueDate - today;
        const daysLeft = Math.ceil(timeDiff / (1000 * 60 * 60 * 24));

        let badgeClass = 'badge';
        let statusTag = `${daysLeft}天後`;

        if (daysLeft === 0) { badgeClass = 'badge alert'; statusTag = '今天繳費！'; }
        else if (daysLeft <= 3) { badgeClass = 'badge alert'; statusTag = `倒數 ${daysLeft} 天`; }
        else if (daysLeft <= 7) { badgeClass = 'badge soon'; }

        div.innerHTML = `
          <div class="trans-main">
            <span class="trans-cat">${card.name}</span>
            <span class="trans-info">結帳日:${card.statementDay}日 | 繳費日:${card.dueDate}日</span>
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            <span class="${badgeClass}">${statusTag}</span>
            <button class="btn-danger" onclick="deleteCard(${card.id})">刪除</button>
          </div>
        `;
        listEl.appendChild(div);
      });
    }

    function deleteCard(id) {
      if (confirm('確定要刪除這張信用卡嗎？')) {
        creditCards = creditCards.filter(c => c.id !== id);
        localStorage.setItem('creditCards', JSON.stringify(creditCards));
        init();
      }
    }

    // --- 交易記錄渲染 ---
    function renderTransactions() {
      const listEl = document.getElementById('transactionList');
      listEl.innerHTML = '';

      const sortedTransactions = [...transactions].sort((a, b) => new Date(b.date) - new Date(a.date));

      if (sortedTransactions.length === 0) {
        listEl.innerHTML = '<p style="font-size:0.85rem; color:var(--text-light); text-align:center; padding:10px;">目前沒有記帳資料</p>';
        return;
      }

      sortedTransactions.slice(0, 20).forEach(t => {
        const div = document.createElement('div');
        div.className = 'transaction-item';

        const isIncome = t.type === 'income';
        const amountClass = isIncome ? 'trans-amount amount-income' : 'trans-amount amount-expense';
        const sign = isIncome ? '+' : '-';
        
        const d = new Date(t.date);
        const dateShow = `${d.getMonth()+1}/${d.getDate()}`;
        const paymentInfo = t.paymentMethod ? ` • ${t.paymentMethod.replace('信用卡:', '')}` : '';

        div.innerHTML = `
          <div class="trans-main">
            <span class="trans-cat">${t.category}</span>
            <span class="trans-info">${dateShow}${paymentInfo}</span>
          </div>
          <div class="${amountClass}">
            ${sign}${parseFloat(t.amount).toLocaleString()}
          </div>
        `;
        
        listEl.appendChild(div);
      });
    }

    // --- 表單事件監聽 ---
    document.getElementById('budgetForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const amount = parseFloat(document.getElementById('budgetAmount').value);
      if (amount > 0) {
        monthlyBudget = amount;
        localStorage.setItem('monthlyBudget', monthlyBudget);
        alert('預算設定成功！');
        document.querySelector('details').open = false;
        init();
      }
    });

    document.getElementById('transactionForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const type = document.getElementById('type').value;
      const paymentMethod = document.getElementById('paymentMethod').value;
      const amount = document.getElementById('amount').value;
      const category = document.getElementById('category').value;
      const date = document.getElementById('date').value;

      if(amount <= 0) { alert('請輸入金額'); return; }

      transactions.push({ id: Date.now(), type, paymentMethod, amount, category, date });
      localStorage.setItem('transactions', JSON.stringify(transactions));

      document.getElementById('amount').value = '';
      document.getElementById('category').value = '';
      document.getElementById('date').value = todayStr;
      
      document.activeElement.blur();
      init();
    });

    document.getElementById('cardForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('cardName').value;
      const statementDay = parseInt(document.getElementById('statementDay').value);
      const dueDate = parseInt(document.getElementById('dueDate').value);

      if (statementDay < 1 || statementDay > 31 || dueDate < 1 || dueDate > 31) {
        alert('日期請輸入 1-31');
        return;
      }

      creditCards.push({ id: Date.now(), name, statementDay, dueDate });
      localStorage.setItem('creditCards', JSON.stringify(creditCards));

      document.getElementById('cardName').value = '';
      document.getElementById('statementDay').value = '';
      document.getElementById('dueDate').value = '';
      
      document.querySelector('details').open = false;
      init();
    });

    init();
  </script>
</body>
</html>
