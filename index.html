<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人消費控制助手</title>
  <style>
    :root {
      --primary: #4f46e5;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #1f2937;
      --income: #10b981;
      --expense: #ef4444;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      max-width: 480px;
      margin: 0 auto;
    }

    h1, h2, h3 {
      margin-bottom: 12px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    /* 儲蓄與收支儀表板 */
    .dashboard {
      text-align: center;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
    }

    .savings-amount {
      font-size: 2.2rem;
      font-weight: bold;
      margin: 8px 0;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.2);
      padding-top: 12px;
    }

    .stat-box {
      font-size: 0.9rem;
    }

    .stat-box span {
      display: block;
      font-size: 1.2rem;
      font-weight: bold;
      margin-top: 4px;
    }

    /* 表單樣式 */
    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 4px;
      color: #6b7280;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:active {
      opacity: 0.8;
    }

    /* 信用卡提醒列表 */
    .card-reminder-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #f3f4f6;
    }

    .card-reminder-item:last-child {
      border-bottom: none;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: bold;
      background-color: #e5e7eb;
    }

    .badge.alert {
      background-color: #fee2e2;
      color: var(--expense);
    }

    /* 交易清單 */
    .transaction-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #f3f4f6;
    }

    .amount-income {
      color: var(--income);
      font-weight: bold;
    }

    .amount-expense {
      color: var(--expense);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>?? 個人財務助手</h1>

  <!-- 當月總覽儀表板 -->
  <div class="card dashboard">
    <div>本月預估可存金額</div>
    <div class="savings-amount" id="savingsAmount">$0</div>
    <div class="stats-grid">
      <div class="stat-box">
        本月總收入
        <span id="monthlyIncome" style="color: #6ee7b7;">+$0</span>
      </div>
      <div class="stat-box">
        本月總支出
        <span id="monthlyExpense" style="color: #fca5a5;">-$0</span>
      </div>
    </div>
  </div>

  <!-- 信用卡提醒卡片 -->
  <div class="card">
    <h3>?? 信用卡繳費與結帳提醒</h3>
    <div id="creditCardList">
      <!-- 動態載入信用卡資訊 -->
    </div>
    <hr style="margin: 12px 0; border: none; border-top: 1px dashed #e5e7eb;">
    <details>
      <summary style="font-size: 0.85rem; color: var(--primary); cursor: pointer;">+ 設定信用卡日期</summary>
      <form id="cardForm" style="margin-top: 10px;">
        <div class="form-group">
          <input type="text" id="cardName" placeholder="卡片名稱 (如: 玉山 Cube)" required>
        </div>
        <div class="form-group" style="display: flex; gap: 8px;">
          <input type="number" id="statementDay" placeholder="結帳日 (1-31)" min="1" max="31" required>
          <input type="number" id="dueDate" placeholder="繳費日 (1-31)" min="1" max="31" required>
        </div>
        <button type="submit">儲存卡片</button>
      </form>
    </details>
  </div>

  <!-- 新增記帳卡片 -->
  <div class="card">
    <h3>?? 新增收支記錄</h3>
    <form id="transactionForm">
      <div class="form-group">
        <select id="type">
          <option value="expense">支出 (-)</option>
          <option value="income">收入 (+)</option>
        </select>
      </div>
      <div class="form-group">
        <input type="number" id="amount" placeholder="金額" required>
      </div>
      <div class="form-group">
        <input type="text" id="category" placeholder="類別 (如: 餐飲、薪資、娛樂)" required>
      </div>
      <div class="form-group">
        <input type="date" id="date" required>
      </div>
      <button type="submit">記下一筆</button>
    </form>
  </div>

  <!-- 近期明細 -->
  <div class="card">
    <h3>?? 當月明細記錄</h3>
    <div id="transactionList">
      <!-- 動態載入明細 -->
    </div>
  </div>

  <script>
    // 資料狀態
    let transactions = JSON.parse(localStorage.getItem('transactions')) || [];
    let creditCards = JSON.parse(localStorage.getItem('creditCards')) || [];

    // 初始化預設日期為今天
    document.getElementById('date').valueAsDate = new Date();

    // 初始化 App
    function init() {
      updateDashboard();
      renderCreditCards();
      renderTransactions();
    }

    // 1. 更新當月可存金額儀表板
    function updateDashboard() {
      const now = new Date();
      const currentYear = now.getFullYear();
      const currentMonth = now.getMonth();

      let totalIncome = 0;
      let totalExpense = 0;

      transactions.forEach(t => {
        const tDate = new Date(t.date);
        if (tDate.getFullYear() === currentYear && tDate.getMonth() === currentMonth) {
          if (t.type === 'income') {
            totalIncome += parseFloat(t.amount);
          } else {
            totalExpense += parseFloat(t.amount);
          }
        }
      });

      const savings = totalIncome - totalExpense;

      document.getElementById('monthlyIncome').textContent = `+$${totalIncome.toLocaleString()}`;
      document.getElementById('monthlyExpense').textContent = `-$${totalExpense.toLocaleString()}`;
      document.getElementById('savingsAmount').textContent = `$${savings.toLocaleString()}`;
    }

    // 2. 渲染信用卡提醒
    function renderCreditCards() {
      const listEl = document.getElementById('creditCardList');
      listEl.innerHTML = '';

      if (creditCards.length === 0) {
        listEl.innerHTML = '<p style="font-size:0.85rem; color:#9ca3af;">尚未新增信用卡資料</p>';
        return;
      }

      const today = new Date();
      const currentDay = today.getDate();

      creditCards.forEach(card => {
        const div = document.createElement('div');
        div.className = 'card-reminder-item';

        // 簡單計算距離繳費日的天數
        let daysLeft = card.dueDate - currentDay;
        if (daysLeft < 0) {
          daysLeft += 30; // 粗略估計下個月
        }

        const isAlert = daysLeft <= 5;
        const badgeClass = isAlert ? 'badge alert' : 'badge';

        div.innerHTML = `
          <div>
            <strong>${card.name}</strong>
            <div style="font-size: 0.75rem; color: #6b7280;">結帳日: 每月 ${card.statementDay} 日</div>
          </div>
          <div>
            <span class="${badgeClass}">繳費日: ${card.dueDate} 日 (${daysLeft}天後)</span>
          </div>
        `;
        listEl.appendChild(div);
      });
    }

    // 3. 渲染交易明細
    function renderTransactions() {
      const listEl = document.getElementById('transactionList');
      listEl.innerHTML = '';

      const sortedTransactions = [...transactions].sort((a, b) => new Date(b.date) - new Date(a.date));

      if (sortedTransactions.length === 0) {
        listEl.innerHTML = '<p style="font-size:0.85rem; color:#9ca3af;">目前沒有記帳資料</p>';
        return;
      }

      sortedTransactions.slice(0, 10).forEach(t => {
        const div = document.createElement('div');
        div.className = 'transaction-item';

        const isIncome = t.type === 'income';
        const amountClass = isIncome ? 'amount-income' : 'amount-expense';
        const sign = isIncome ? '+' : '-';

        div.innerHTML = `
          <div>
            <div><strong>${t.category}</strong></div>
            <div style="font-size: 0.75rem; color: #9ca3af;">${t.date}</div>
          </div>
          <div class="${amountClass}">
            ${sign}$${parseFloat(t.amount).toLocaleString()}
          </div>
        `;
        listEl.appendChild(div);
      });
    }

    // 事件監聽：新增交易
    document.getElementById('transactionForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const type = document.getElementById('type').value;
      const amount = document.getElementById('amount').value;
      const category = document.getElementById('category').value;
      const date = document.getElementById('date').value;

      transactions.push({ id: Date.now(), type, amount, category, date });
      localStorage.setItem('transactions', JSON.stringify(transactions));

      // 重置表單與更新畫面
      document.getElementById('amount').value = '';
      document.getElementById('category').value = '';
      init();
    });

    // 事件監聽：新增信用卡
    document.getElementById('cardForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('cardName').value;
      const statementDay = parseInt(document.getElementById('statementDay').value);
      const dueDate = parseInt(document.getElementById('dueDate').value);

      creditCards.push({ id: Date.now(), name, statementDay, dueDate });
      localStorage.setItem('creditCards', JSON.stringify(creditCards));

      // 重置表單與更新畫面
      document.getElementById('cardName').value = '';
      document.getElementById('statementDay').value = '';
      document.getElementById('dueDate').value = '';
      init();
    });

    // 啟動應用程式
    init();
  </script>
</body>
</html>
